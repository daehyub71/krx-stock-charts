name: Daily KRX update

# 평일 18:00 KST = 09:00 UTC. KRX 정규장 마감(15:30 KST) 이후 충분한 여유를 둔다.
on:
  schedule:
    - cron: "0 9 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: '갱신할 거래일 (YYYYMMDD, 비우면 오늘)'
        required: false
        type: string

# 최소 권한: 이 워크플로는 리포에 쓰지 않는다 (데이터는 Supabase로 간다).
permissions:
  contents: read

concurrency:
  group: daily-krx-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # 입력은 셸 명령에 직접 보간하지 않고 환경 변수로 넘긴다.
    # `${{ inputs.date }}`를 run: 안에 그대로 쓰면 임의 명령 주입 경로가 된다.
    env:
      RUN_DATE: ${{ inputs.date }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # 입력 형식을 먼저 강제한다 — 방어를 두 겹으로 둔다(검증 + 인용).
      - name: Validate date input
        run: |
          if [ -n "$RUN_DATE" ] && ! printf '%s' "$RUN_DATE" | grep -qE '^[0-9]{8}$'; then
            echo "date 입력은 YYYYMMDD 8자리 숫자여야 합니다." >&2
            exit 1
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 종목 유니버스를 먼저 갱신한다 — KOSPI200 정기 변경으로 편입된 종목을
      # 당일 갱신 대상에 포함시키기 위해서다 (PLAN §6).
      # 2026-08-30: Actions 러너에서 KRX 로그인이 막혀(08-18~) 이 단계가 실패해도
      # 시세 수집(로그인 불필요)은 계속 돌게 한다. 종목 목록은 Supabase의 기존 ksc_tickers를 쓴다.
      # 실패는 단계 상태(주황)로 남기고, 실패 시 진단 로그(응답 status/type)가 stderr에 찍힌다.
      - name: Refresh ticker universe
        id: universe
        continue-on-error: true
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -n "$RUN_DATE" ]; then
            python -m pipeline.main --universe --date "$RUN_DATE"
          else
            python -m pipeline.main --universe
          fi

      - name: Universe result
        if: steps.universe.outcome == 'failure'
        run: echo "::warning::종목 목록 갱신 실패 — 기존 ksc_tickers로 증분 갱신을 진행합니다 (진단 로그는 위 단계 참조)"

      - name: Incremental update
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -n "$RUN_DATE" ]; then
            python -m pipeline.main --update --date "$RUN_DATE"
          else
            python -m pipeline.main --update
          fi
